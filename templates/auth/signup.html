{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
  <h2>Sign Up</h2>
  <form method="POST" style="margin-top: 16px;">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Register</button>
  </form>
  <p style="margin-top: 16px; text-align: center; font-size: 0.9rem;">
    Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
  </p>
</div>
{% endblock %}
