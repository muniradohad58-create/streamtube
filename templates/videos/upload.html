{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper" style="max-width: 600px;">
  <h2>Upload Video</h2>
  <form method="POST" style="margin-top: 16px;">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" required>
    </div>
    <div class="form-group">
      <label>Video URL (YouTube, Vimeo, Dailymotion, or direct MP4/Embed link)</label>
      <input type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required>
    </div>
    <div class="form-group">
      <label>Custom Thumbnail URL (Optional)</label>
      <input type="url" name="thumbnail_url" placeholder="Auto-generated if left blank">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select name="category">
        <option value="General">General</option>
        <option value="Music">Music</option>
        <option value="Gaming">Gaming</option>
        <option value="Tech">Tech</option>
        <option value="Education">Education</option>
        <option value="Entertainment">Entertainment</option>
      </select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Upload Video</button>
  </form>
</div>
{% endblock %}
