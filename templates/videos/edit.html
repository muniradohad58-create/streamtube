{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper" style="max-width: 600px;">
  <h2>Edit Video</h2>
  <form method="POST" style="margin-top: 16px;">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" value="{{ video.title }}" required>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select name="category">
        <option value="General" {% if video.category == 'General' %}selected{% endif %}>General</option>
        <option value="Music" {% if video.category == 'Music' %}selected{% endif %}>Music</option>
        <option value="Gaming" {% if video.category == 'Gaming' %}selected{% endif %}>Gaming</option>
        <option value="Tech" {% if video.category == 'Tech' %}selected{% endif %}>Tech</option>
        <option value="Education" {% if video.category == 'Education' %}selected{% endif %}>Education</option>
        <option value="Entertainment" {% if video.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
      </select>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" rows="4">{{ video.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Save Changes</button>
  </form>
</div>
{% endblock %}
